<div class="login-container" style="max-width: 400px; margin: 2rem auto; font-family: 'Segoe UI', system-ui, sans-serif">
    <!-- School Header -->
    <div class="text-center mb-4">
      <img src="{% static 'images/school-logo.png' %}" alt="School logo" style="height: 65px;" class="mb-3">
      <h2 class="h4" style="color: #2c3e50; font-weight: 500;">School portal login</h2>
      <p class="small text-muted mt-1">Enter your credentials to access the system</p>
    </div>
  
    <!-- Login Card -->
    <div class="card border-0" style="border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);">
      <div class="card-body p-4">
        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          
          <!-- Username Field -->
          <div class="mb-3">
            <label for="username" class="form-label small text-muted">Username</label>
            <div class="input-group" style="border-radius: 6px; border: 1px solid #e0e0e0;">
              <span class="input-group-text bg-white border-end-0">
                <i class="fas fa-user text-muted"></i>
              </span>
              <input type="text" class="form-control border-start-0" id="username" name="username" 
                     placeholder="Enter username" style="height: 44px;">
            </div>
          </div>
  
          <!-- Password Field -->
          <div class="mb-2">
            <label for="password" class="form-label small text-muted">Password</label>
            <div class="input-group" style="border-radius: 6px; border: 1px solid #e0e0e0;">
              <span class="input-group-text bg-white border-end-0">
                <i class="fas fa-lock text-muted"></i>
              </span>
              <input type="password" class="form-control border-start-0" id="password" name="password" 
                     placeholder="Enter password" style="height: 44px;">
              <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="togglePassword">
                <i class="fas fa-eye text-muted"></i>
              </button>
            </div>
          </div>
  
          <!-- Forgot Password -->
          <div class="d-flex justify-content-end mb-4">
            <a href="{% url 'password_reset' %}" class="small" style="color: #2980b9; text-decoration: none;">
              Forgot your password?
            </a>
          </div>
  
          <!-- Sign In Button -->
          <button type="submit" class="btn w-100 py-2 mb-3" 
                  style="background-color: #2c3e50; color: white; border-radius: 6px; height: 44px; font-weight: 500;">
            Sign in
          </button>
  
          <!-- Divider -->
          <div class="position-relative text-center my-3">
            <hr style="border-top: 1px solid #f0f0f0; margin: 1.5rem 0;">
            <span class="position-absolute bg-white px-2" 
                  style="top: -9px; left: 50%; transform: translateX(-50%); color: #95a5a6; font-size: 12px;">or</span>
          </div>
  
          <!-- Create Account -->
          <div class="text-center pt-1">
            <p class="small text-muted mb-2">Don't have an account?</p>
            <a href="{% url 'register' %}" class="btn btn-outline-secondary w-100 py-2" 
               style="border-radius: 6px; height: 44px; border-color: #ddd; color: #2c3e50; font-weight: 500;">
              Create new account
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script>
  // Toggle password visibility
  document.getElementById('togglePassword').addEventListener('click', function() {
    const password = document.getElementById('password');
    const icon = this.querySelector('i');
    if (password.type === 'password') {
      password.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      password.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  });
  
  // Add focus effects
  document.querySelectorAll('.form-control').forEach(input => {
    input.addEventListener('focus', function() {
      this.parentElement.style.borderColor = '#3498db';
      this.parentElement.style.boxShadow = '0 0 0 2px rgba(52,152,219,0.15)';
    });
    
    input.addEventListener('blur', function() {
      this.parentElement.style.borderColor = '#e0e0e0';
      this.parentElement.style.boxShadow = 'none';
    });
  });
  </script>
  
  <style>
  .login-container {
    padding: 1.5rem;
  }
  
  .btn {
    transition: all 0.2s ease;
  }
  
  .btn:hover {
    transform: translateY(-1px);
  }
  
  .input-group:focus-within {
    transition: all 0.2s ease;
  }
  
  .form-control:focus {
    box-shadow: none !important;
  }
  </style>
